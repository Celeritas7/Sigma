<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useLayoutEffect, useMemo, useRef, useCallback } from 'react'
import { createRoot } from 'react-dom/client'
import { createClient } from '@supabase/supabase-js'

// =============================================================================
// CONFIG (UNCHANGED from original — same Supabase project, same tables)
// =============================================================================
const SUPABASE_URL = 'https://wylxvmkcrexwfpjpbhyy.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_e3pDOuxIdstaC7s0a680kQ_R10TrAyv'

let supabase = null
let supabaseInitError = null
try {
  supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
} catch (e) {
  supabaseInitError = e.message || String(e)
}
if (supabase && window.AkatsukiBroadcast) window.AkatsukiBroadcast(supabase, 'sigma').start()
// =============================================================================
// CALCULATIONS
// =============================================================================
// An option must be scored on at least this share of the considerations that
// carry weight before it's ranked. Totals average only the scored cells, so
// without this one lucky score could out-rank a fully scored option.
const MIN_COVERAGE = 0.5
// Totals closer than this display identically (2 decimals), so call them a tie.
const TIE_EPSILON = 0.005

function scoreStats(optionId, scores, parameters, weightOverrides = null) {
  let wSum = 0, vSum = 0, active = 0, scored = 0
  for (const p of parameters) {
    const w = weightOverrides?.[p.id] ?? Number(p.weight)
    if (w <= 0) continue
    active++
    const s = scores.find(sc => sc.option_id === optionId && sc.parameter_id === p.id)
    if (!s || s.value == null) continue
    scored++
    wSum += w
    vSum += Number(s.value) * w
  }
  return { total: wSum > 0 ? vSum / wSum : null, scored, active }
}

function weightedTotal(optionId, scores, parameters, weightOverrides = null) {
  return scoreStats(optionId, scores, parameters, weightOverrides).total
}

// Ranked options come first (by total); options with too few scores sort
// after them and are never treated as the leader.
function rankedOptions(options, scores, parameters, weightOverrides = null) {
  return options
    .map(o => {
      const st = scoreStats(o.id, scores, parameters, weightOverrides)
      return { ...o, _total: st.total, _scored: st.scored, _active: st.active,
        _ranked: st.total != null && st.scored >= st.active * MIN_COVERAGE }
    })
    .sort((a, b) => (b._ranked - a._ranked) || ((b._total ?? -1) - (a._total ?? -1)))
}

// Leader, runner-up and the gap between them, from a rankedOptions() result.
function standing(ranked) {
  const top = ranked[0]?._ranked ? ranked[0] : null
  const runner = top && ranked[1]?._ranked ? ranked[1] : null
  const gap = runner ? top._total - runner._total : null
  return { top, runner, gap, tied: gap != null && gap < TIE_EPSILON }
}

// small seeded PRNG (mulberry32): deterministic, so the same data always
// gives the same robustness number
function mulberry32(seed) {
  let a = seed >>> 0
  return () => {
    a = (a + 0x6D2B79F5) >>> 0
    let t = Math.imul(a ^ (a >>> 15), 1 | a)
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}

function hashString(str) {
  let h = 2166136261
  for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619)
  return h >>> 0
}

function shuffled(items, rand) {
  const a = [...items]
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]]
  }
  return a
}

function paramContribution(optionId, paramId, scores, parameters, weightOverrides = null) {
  const p = parameters.find(x => x.id === paramId)
  if (!p) return 0
  const w = weightOverrides?.[paramId] ?? Number(p.weight)
  const s = scores.find(sc => sc.option_id === optionId && sc.parameter_id === paramId)
  if (!s || s.value == null) return 0
  return Number(s.value) * w
}

function completeness(parameters, options, scores) {
  const total = parameters.length * options.length
  if (!total) return { filled: 0, total: 0, pct: 0 }
  let filled = 0
  for (const o of options) for (const p of parameters) {
    if (scores.find(s => s.option_id === o.id && s.parameter_id === p.id && s.value != null)) filled++
  }
  return { filled, total, pct: filled / total }
}

// deterministic monte-carlo: independent ±2 jitter on each weight, count how
// often the leader holds. null when there's no clear leader to test.
function robustness(parameters, options, scores) {
  const { top, tied } = standing(rankedOptions(options, scores, parameters))
  if (!top || tied) return null
  const rand = mulberry32(0x5167)
  let holds = 0
  const N = 100
  for (let i = 0; i < N; i++) {
    const over = {}
    for (const p of parameters) {
      over[p.id] = Math.max(0, Math.min(10, Number(p.weight) + (rand() * 4 - 2)))
    }
    if (standing(rankedOptions(options, scores, parameters, over)).top?.id === top.id) holds++
  }
  return holds / N
}

function perWeightSensitivity(parameters, options, scores) {
  const { top, tied } = standing(rankedOptions(options, scores, parameters))
  if (!top || tied) return []
  const topId = top.id
  return parameters.map(p => {
    let flipped = 0; let flipAt = null
    for (let w = 0; w <= 10; w += 0.5) {
      const r = rankedOptions(options, scores, parameters, { [p.id]: w })
      if (standing(r).top?.id !== topId) { flipped++; if (flipAt == null) flipAt = w }
    }
    return { p, sens: flipped / 21, flipAt }
  })
}

// =============================================================================
// THEME STATE (persisted to localStorage)
// =============================================================================
const ACCENT_OPTIONS = [
  { name: 'green', hue: 145 },
  { name: 'blue',  hue: 260 },
  { name: 'coral', hue: 30 },
  { name: 'plum',  hue: 320 },
]
function applyAccent(hue) {
  const r = document.documentElement
  r.style.setProperty('--accent',      `oklch(0.58 0.16 ${hue})`)
  r.style.setProperty('--accent-soft', `oklch(0.93 0.05 ${hue})`)
  r.style.setProperty('--accent-ink',  `oklch(0.32 0.13 ${hue})`)
}

// ── color system ───────────────────────────────────────────────────────────
// Each decision "kind" resolves (by keyword) to a distinct icon + hue, so real
// type names like "Housing" or "Career" each get a unique icon, not a shared
// fallback. Each option gets a stable color by position.
const KIND_DEFS = [
  { test: /job|career|work|offer|employ/i,                   emoji: '💼', hue: 255 },
  { test: /apart|hous|home|flat|rent|move|live|condo/i,      emoji: '🏠', hue: 155 },
  { test: /nam|brand|title|label/i,                          emoji: '🏷️', hue: 305 },
  { test: /strateg|focus|business|product|roadmap|q[1-4]/i,  emoji: '🎯', hue: 75 },
  { test: /school|study|colleg|univ|educat|course|degree/i,  emoji: '🎓', hue: 215 },
  { test: /car|vehicle|auto|bike/i,                          emoji: '🚗', hue: 25 },
  { test: /invest|money|financ|budget|stock|fund/i,          emoji: '💰', hue: 130 },
  { test: /travel|trip|vacation|holiday|flight/i,            emoji: '✈️', hue: 235 },
  { test: /health|doctor|medical|fitness/i,                  emoji: '🩺', hue: 10 },
  { test: /food|restaurant|eat|meal|recipe/i,                emoji: '🍽️', hue: 55 },
  { test: /relationship|partner|date|love|family/i,          emoji: '❤️', hue: 350 },
  { test: /life|personal/i,                                  emoji: '🧭', hue: 195 },
]
const KIND_FALLBACK = { emoji: '🗳️', hue: 285 }
function kindDef(kind) { const k = String(kind || ''); return KIND_DEFS.find(d => d.test.test(k)) || KIND_FALLBACK }
function kindEmoji(kind) { return kindDef(kind).emoji }
function kindHue(kind) { return kindDef(kind).hue }
function kindColor(kind) { return `oklch(0.56 0.15 ${kindHue(kind)})` }
function kindSoft(kind) { return `oklch(0.94 0.05 ${kindHue(kind)})` }
// option palette — distinct, evenly-spread hues, muted enough to coexist
const OPTION_HUES = [255, 25, 155, 305, 75, 200, 340, 120, 285, 45]
function optionColor(i) { return `oklch(0.6 0.14 ${OPTION_HUES[i % OPTION_HUES.length]})` }
function optionSoft(i) { return `oklch(0.95 0.045 ${OPTION_HUES[i % OPTION_HUES.length]})` }

// =============================================================================
// SMALL UI ATOMS
// =============================================================================
function Pill({ children, color, bg, style }) {
  const c = color || 'var(--ink)'
  return <span className="pill" style={{
    background: bg || `color-mix(in oklch, ${c} 14%, var(--bg))`,
    color: c, ...style,
  }}>{children}</span>
}

function InlineText({ value, onCommit, placeholder, style, multiline }) {
  const [draft, setDraft] = useState(value ?? '')
  const [editing, setEditing] = useState(false)
  useEffect(() => setDraft(value ?? ''), [value])
  if (!editing) {
    return <span onClick={() => setEditing(true)} style={{
      cursor: 'text', display: 'inline-block', minHeight: '1em',
      color: value ? (style?.color || 'var(--ink)') : 'var(--ink-faint)',
      fontStyle: value ? 'normal' : 'italic', ...style,
    }}>{value || placeholder || '—'}</span>
  }
  const Tag = multiline ? 'textarea' : 'input'
  return <Tag autoFocus value={draft}
    onChange={e => setDraft(e.target.value)}
    onBlur={() => { setEditing(false); if (draft !== value) onCommit(draft) }}
    onKeyDown={e => { if (e.key === 'Enter' && !multiline) e.target.blur(); if (e.key === 'Escape') { setDraft(value ?? ''); setEditing(false) }}}
    placeholder={placeholder}
    rows={multiline ? 3 : undefined}
    style={{
      ...style, background: 'var(--bg-soft)', border: '1px solid var(--rule)',
      borderRadius: 4, padding: '4px 6px', width: '100%',
      fontFamily: 'inherit', fontSize: 'inherit', fontWeight: 'inherit',
      resize: multiline ? 'vertical' : 'none', color: 'var(--ink)',
    }}
  />
}

function WeightSlider({ value, original, onChange, hue, ghostMark, height = 22, thumbSize = 14 }) {
  const trackRef = useRef(null)
  const [dragging, setDragging] = useState(false)
  const color = hue != null ? `oklch(0.58 0.16 ${hue})` : 'var(--ink)'
  const move = useCallback(cx => {
    if (!trackRef.current) return
    const r = trackRef.current.getBoundingClientRect()
    const t = Math.max(0, Math.min(1, (cx - r.left) / r.width))
    onChange(Math.round(t * 20) / 2)
  }, [onChange])
  useEffect(() => {
    if (!dragging) return
    const m = e => move(e.clientX)
    const u = () => setDragging(false)
    window.addEventListener('pointermove', m)
    window.addEventListener('pointerup', u)
    return () => { window.removeEventListener('pointermove', m); window.removeEventListener('pointerup', u) }
  }, [dragging, move])
  const showGhost = ghostMark && original != null && Math.abs(original - value) > 0.01
  return (
    <div ref={trackRef}
      onPointerDown={e => { setDragging(true); move(e.clientX) }}
      style={{ position: 'relative', height, cursor: 'pointer', touchAction: 'none', userSelect: 'none' }}>
      <div style={{ position: 'absolute', top: '50%', left: 0, right: 0, height: 3, marginTop: -1.5, background: 'var(--bg-inset)', border: '1px solid var(--rule)', borderRadius: 2 }} />
      <div style={{ position: 'absolute', top: '50%', left: 0, marginTop: -1.5, width: `${(value / 10) * 100}%`, height: 3, background: color, borderRadius: 2, transition: dragging ? 'none' : 'width 180ms' }} />
      {showGhost && <div style={{ position: 'absolute', top: 4, left: `calc(${(original / 10) * 100}% - 1px)`, width: 2, height: height - 8, background: 'var(--ink-faint)', opacity: 0.5 }} />}
      <div style={{ position: 'absolute', top: `calc(50% - ${thumbSize / 2}px)`, left: `calc(${(value / 10) * 100}% - ${thumbSize / 2}px)`, width: thumbSize, height: thumbSize, background: color, borderRadius: 4, boxShadow: dragging ? `0 0 0 4px color-mix(in oklch, ${color} 25%, transparent)` : 'none', transition: dragging ? 'none' : 'left 180ms' }} />
    </div>
  )
}

function ScoreInput({ value, onChange, autoFocus }) {
  const [draft, setDraft] = useState(value != null ? String(value) : '')
  useEffect(() => setDraft(value != null ? String(value) : ''), [value])
  const commit = () => {
    if (draft === '') { if (value != null) onChange(null); return }
    const n = parseFloat(draft)
    if (!isNaN(n)) onChange(Math.max(0, Math.min(10, n)))
    else setDraft(value != null ? String(value) : '')
  }
  return (
    <input type="text" inputMode="decimal" value={draft} autoFocus={autoFocus}
      onChange={e => setDraft(e.target.value.replace(/[^0-9.]/g, ''))}
      onBlur={commit}
      onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') { setDraft(value != null ? String(value) : ''); e.target.blur() }}}
      placeholder="—"
      style={{ width: '100%', padding: '4px 6px', fontFamily: 'Geist Mono, ui-monospace, monospace', fontSize: 13, border: '1px solid var(--rule)', borderRadius: 4, color: 'var(--ink)', fontVariantNumeric: 'tabular-nums', textAlign: 'right' }}
    />
  )
}

function RawInput({ value, onChange, unit, type, options }) {
  const [draft, setDraft] = useState(value ?? '')
  useEffect(() => setDraft(value ?? ''), [value])
  if (type === 'categorical' && options?.length) {
    return (
      <select value={value ?? ''} onChange={e => onChange(e.target.value || null)}
        style={{ width: '100%', padding: '4px 6px', fontSize: 12, border: '1px solid var(--rule)', borderRadius: 4, background: 'var(--bg)', appearance: 'none', color: 'var(--ink)' }}>
        <option value="">—</option>
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    )
  }
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
      <input type="text" value={draft} onChange={e => setDraft(e.target.value)}
        onBlur={() => draft !== value && onChange(draft || null)}
        onKeyDown={e => { if (e.key === 'Enter') e.target.blur() }}
        placeholder="raw evidence"
        style={{ width: '100%', padding: '4px 6px', fontFamily: 'Geist Mono, ui-monospace, monospace', fontSize: 11, border: '1px solid var(--rule)', borderRadius: 4, color: 'var(--ink-soft)' }}

      {unit && <span className="label" style={{ flexShrink: 0 }}>{unit}</span>}
    </div>
  )
}

function SignIn() {
  const [busy, setBusy] = useState(false)
  const [error, setError] = useState(null)
  const signIn = async () => {
    setBusy(true); setError(null)
    // come back to this exact page after Google; this URL must be in the
    // Supabase project's Auth > URL Configuration > Redirect URLs
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + window.location.pathname },
    })
    if (error) { setError(error.message); setBusy(false) }
  }
  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
      <div className="card" style={{ width: 380, maxWidth: '100%', padding: '36px 32px', textAlign: 'center' }}>

        <p style={{ fontSize: 14, color: 'var(--ink-soft)', margin: '0 0 24px', lineHeight: 1.5 }}>Sign in to see your decisions. They're private to your account.</p>

          {busy ? 'Opening Google…' : 'Continue with Google'}

        {error && <p style={{ fontSize: 13, color: 'var(--neg)', margin: '14px 0 0' }}>{error}</p>}
      </div>
    </div>
  )
}

function AccentMenu() {
  const [open, setOpen] = useState(false)
  const rootRef = useRef(null)
  const cur = localStorage.getItem('sigma_accent') || 'green'
  useEffect(() => {
    if (!open) return
    const h = e => { if (rootRef.current && !rootRef.current.contains(e.target)) setOpen(false) }
    document.addEventListener('pointerdown', h)
    return () => document.removeEventListener('pointerdown', h)
  }, [open])
  return (
    <div ref={rootRef} style={{ position: 'relative' }}>
      <button onClick={() => setOpen(o => !o)} className="iconbtn" title="theme">
        <span style={{ width: 14, height: 14, borderRadius: '50%', background: 'var(--accent)' }} />
      </button>
      {open && (
        <div onMouseLeave={() => setOpen(false)} style={{
          position: 'absolute', top: 36, right: 0, background: 'var(--bg)', border: '1px solid var(--rule)',
          borderRadius: 8, padding: 10, zIndex: 100, boxShadow: '0 8px 24px rgba(0,0,0,0.12)',

function HomeRow({ d, idx, onClick, onDelete }) {
  const [hover, setHover] = useState(false)
  const ranked = rankedOptions(d._options, d._scores, d._parameters)
  const { top: leading, gap, tied } = standing(ranked)
  const hasScores = ranked.some(o => o._total != null)
  const c = completeness(d._parameters, d._options, d._scores)
  const daysOpen = Math.max(1, Math.floor((Date.now() - new Date(d.created_at).getTime()) / 86400000))
  const statusLabel = c.pct >= 0.7 ? 'ready to choose' : c.pct >= 0.35 ? 'still gathering' : 'just started'
  const kc = kindColor(d.type)
  const statusColor = c.pct >= 0.7 ? 'var(--accent)' : c.pct >= 0.35 ? 'var(--warn)' : 'var(--ink-ghost)'
  return (
    <div onClick={onClick} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{ display: 'grid', gridTemplateColumns: '36px 2.6fr 1.7fr 1.4fr 70px', gap: 16, alignItems: 'center', padding: '18px 18px', borderBottom: '1px solid var(--rule-soft)', cursor: 'pointer', background: hover ? kindSoft(d.type) : 'transparent', boxShadow: hover ? `inset 3px 0 0 ${kc}` : 'inset 0 0 0 transparent', transition: 'background 140ms, box-shadow 140ms' }}>
      <span className="mono" style={{ fontSize: 12, color: kc }}>{String(idx).padStart(2, '0')}</span>
      <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
        <div style={{ width: 36, height: 36, flexShrink: 0, borderRadius: 9, background: kindSoft(d.type), border: `1px solid ${kc}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18, marginTop: 1 }}>{kindEmoji(d.type)}</div>
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
            <span style={{ fontSize: 15, fontWeight: 500 }}>{d.title?.trim() || <em style={{ color: 'var(--ink-faint)' }}>untitled question</em>}</span>
            {tied ? <Pill color="var(--neg)">tied</Pill> : gap != null && gap < 0.6 && <Pill color="var(--neg)">tight</Pill>}
            {c.pct === 0 && <Pill color="var(--ink-faint)">empty</Pill>}
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 5 }}>
            <Pill color={kc}>{d.type || 'custom'}</Pill>
            <span className="label">{d._parameters.length}p × {d._options.length}o</span>
          </div>
        </div>
      </div>
      {leading ? (
        <div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, flexWrap: 'wrap' }}>
            <span style={{ fontSize: 14, fontWeight: 500 }}>{tied ? `${leading.name || 'unnamed'} = ${ranked[1].name || 'unnamed'}` : (leading.name || 'unnamed')}</span>
            <span className="mono" style={{ fontSize: 13, color: tied ? 'var(--ink-soft)' : 'var(--accent)' }}>{leading._total.toFixed(2)}</span>
          </div>
          {gap != null && <span className="label" style={{ marginTop: 4, display: 'block' }}>{tied ? 'tied' : `+${gap.toFixed(2)} ahead`}</span>}
        </div>
      ) : (<span className="label">{hasScores ? 'not enough scores' : 'no scores yet'}</span>)}
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ flex: 1, height: 5, background: 'var(--rule-soft)', borderRadius: 3, overflow: 'hidden' }}>
            <div style={{ width: `${c.pct * 100}%`, height: '100%', background: statusColor, transition: 'width 300ms, background 200ms' }} />
          </div>
          <span className="mono" style={{ fontSize: 11, color: 'var(--ink-soft)', minWidth: 32, textAlign: 'right' }}>{Math.round(c.pct * 100)}%</span>
        </div>
        <span className="label" style={{ marginTop: 6, display: 'block', color: statusColor }}>{statusLabel}</span>
      </div>
      <span className="mono" style={{ fontSize: 11, color: 'var(--ink-faint)', textAlign: 'right' }}>
        {hover
          ? <button className="iconbtn" title="archive decision" style={{ color: 'var(--neg)' }} onClick={e => { e.stopPropagation(); if (confirm(`Archive "${d.title || 'untitled'}"?`)) onDelete() }}>×</button>
          : `${daysOpen}d`}
      </span>
    </div>
  )
}

function WeightPanel({ parameters, overrides, setOverrides, paramColors, paramHues, highlight, setHighlight, isWhatIf, kh, onReset, onSave }) {
  const [open, setOpen] = useState(true)
  const [view, setView] = useState('tiers') // 'tiers' | 'fine'
  const [dragId, setDragId] = useState(null)
  const [overLane, setOverLane] = useState(null)
  const setW = (pp, v) => {
    setOverrides(prev => {
      const next = { ...(prev || {}) }
      if (Math.abs(v - Number(pp.weight)) > 0.01) next[pp.id] = v
      else delete next[pp.id]
      return Object.keys(next).length ? next : null
    })
  }
  const TIERS = [
    { key: 'must',  label: 'Must-have',      value: 10, hue: 145 },
    { key: 'imp',   label: 'Important',      value: 8,  hue: 75 },
    { key: 'nice',  label: 'Nice to have',   value: 5,  hue: 235 },
    { key: 'minor', label: 'Minor',          value: 2,  hue: 25 },
    { key: 'skip',  label: "Doesn't matter", value: 0,  hue: 285 },
  ]
  const tierOf = w => TIERS.reduce((best, t) => Math.abs(w - t.value) < Math.abs(w - best.value) ? t : best, TIERS[0])
  const curW = pp => overrides?.[pp.id] ?? Number(pp.weight)
  const isOver = pp => overrides?.[pp.id] != null && Math.abs(overrides[pp.id] - Number(pp.weight)) > 0.01
  return (
    <div style={{ background: isWhatIf ? 'var(--hi-soft)' : `oklch(0.96 0.03 ${kh})`, borderBottom: `1px solid ${isWhatIf ? 'var(--hi)' : `oklch(0.88 0.05 ${kh})`}`, transition: 'background 200ms' }}>

            {isWhatIf && <button className="btn btn-outline btn-sm" onClick={onReset}>Reset</button>}

                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 9 }}>
                    <span style={{ width: 10, height: 10, borderRadius: 3, background: c, flexShrink: 0 }} />
                    <span style={{ fontSize: 13, fontWeight: 500, lineHeight: 1.25 }}>{pp.name}</span>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                    <WeightStep value={cur} color={over ? 'var(--hi)' : c} onChange={v => setW(pp, v)} />
                    <div style={{ flex: 1 }}>
                      <WeightSlider value={cur} original={Number(pp.weight)} ghostMark={isWhatIf} hue={over ? 260 : paramHues[i % paramHues.length]} onChange={v => setW(pp, v)} />
                    </div>
                  </div>
                </div>
              )
            })}
          </div>
        ) : (
          <div style={{ marginTop: 12, display: 'flex', flexDirection: 'column', gap: 8 }}>
            {TIERS.map(t => {
              const chips = parameters.filter(pp => tierOf(curW(pp)).key === t.key)
              const active = overLane === t.key
              return (
                <div key={t.key}
                  onDragOver={e => { e.preventDefault(); if (overLane !== t.key) setOverLane(t.key) }}
                  onDragLeave={() => setOverLane(l => l === t.key ? null : l)}
                  onDrop={e => { e.preventDefault(); const id = dragId || e.dataTransfer.getData('text/plain'); const pp = parameters.find(p => p.id === id); if (pp) setW(pp, t.value); setDragId(null); setOverLane(null) }}
                  style={{ display: 'grid', gridTemplateColumns: '152px 1fr', alignItems: 'stretch', border: `1px solid ${active ? `oklch(0.6 0.15 ${t.hue})` : 'var(--rule)'}`, borderRadius: 11, background: active ? `oklch(0.975 0.04 ${t.hue})` : 'var(--bg)', transition: 'border-color 120ms, background 120ms', minHeight: 52, overflow: 'hidden' }}>
                  <div style={{ display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 2, padding: '10px 14px', borderRight: '1px solid var(--rule-soft)', background: `oklch(0.97 0.055 ${t.hue})` }}>
                    <span style={{ fontSize: 13, fontWeight: 600, color: `oklch(0.42 0.13 ${t.hue})` }}>{t.label}</span>
                    <span className="label" style={{ color: `oklch(0.52 0.1 ${t.hue})` }}>weight {t.value}</span>
                  </div>
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7, alignItems: 'center', padding: '8px 12px' }}>
                    {chips.length === 0 && <span className="label" style={{ opacity: 0.45 }}>{active ? 'release to drop' : 'drop here'}</span>}
                    {chips.map(pp => {
                      const c = paramColors[pp.id]; const over = isOver(pp)
                      return (
                        <div key={pp.id} draggable
                          onDragStart={e => { setDragId(pp.id); e.dataTransfer.setData('text/plain', pp.id); e.dataTransfer.effectAllowed = 'move' }}
                          onDragEnd={() => { setDragId(null); setOverLane(null) }}
                          onMouseEnter={() => setHighlight(pp.id)} onMouseLeave={() => setHighlight(null)}
                          style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '7px 12px', borderRadius: 9, background: 'var(--bg)', border: `1px solid ${over ? 'var(--hi)' : (highlight === pp.id ? c : 'var(--rule)')}`, boxShadow: 'var(--shadow-sm)', cursor: 'grab', opacity: dragId === pp.id ? 0.35 : 1, transition: 'opacity 120ms' }}>
                          <span style={{ width: 9, height: 9, borderRadius: 3, background: c, flexShrink: 0 }} />
                          <span style={{ fontSize: 13, fontWeight: 500 }}>{pp.name}</span>
                          <span style={{ fontSize: 13, color: 'var(--ink-ghost)', letterSpacing: '-2px', marginLeft: 2 }}>⠿</span>
                        </div>
                      )
                    })}
                  </div>
                </div>
              )
            })}
          </div>
        )}
      </div>
    </div>
  )
}

// =============================================================================
// DECISION VIEW
// =============================================================================
function DecisionView({ decision, data, onBack, onTitleUpdate, paramHandlers, optionHandlers, onScoreUpdate, onOpenMode, onStatusChange, onDelete }) {
  const [overrides, setOverrides] = useState(null)
  const [highlight, setHighlight] = useState(null)

  const ranked = useMemo(() => rankedOptions(data.options, data.scores, data.parameters, overrides), [data, overrides])
  const baseline = useMemo(() => rankedOptions(data.options, data.scores, data.parameters), [data])
  const { top, runner, gap, tied } = standing(ranked)
  const c = completeness(data.parameters, data.options, data.scores)
  const robust = useMemo(() => robustness(data.parameters, data.options, data.scores), [data])
  const isWhatIf = overrides != null

  const paramHues = [145, 30, 260, 75, 320, 200, 60, 290, 175, 240]
  const paramColors = {}
  data.parameters.forEach((pp, i) => { paramColors[pp.id] = `oklch(0.62 0.13 ${paramHues[i % paramHues.length]})` })
  const optColors = {}
  data.options.forEach((o, i) => { optColors[o.id] = optionColor(i) })

  const onWeightEdit = (pid, w) => {
    const v = Math.max(0, Math.min(10, w))
    if (overrides?.[pid] != null) {
      const next = { ...overrides }
      delete next[pid]
      setOverrides(Object.keys(next).length ? next : null)
    }
    paramHandlers.onUpdate(pid, { weight: v })
  }

  const kh = kindHue(decision.type)
  return (
    <div style={{
      minHeight: '100vh',
      background: `radial-gradient(1100px 460px at 50% -120px, oklch(0.93 0.06 ${kh} / 0.7), transparent 65%), linear-gradient(180deg, oklch(0.96 0.03 ${kh} / 0.45), transparent 340px)`,
    }}>
      {/* WEIGHT PANEL */}
      <WeightPanel
        parameters={data.parameters}
        overrides={overrides} setOverrides={setOverrides}
        paramColors={paramColors} paramHues={paramHues}
        highlight={highlight} setHighlight={setHighlight}
        isWhatIf={isWhatIf} kh={kh}
        onReset={() => setOverrides(null)}
        onSave={async () => {
          for (const [pid, w] of Object.entries(overrides)) await paramHandlers.onUpdate(pid, { weight: w })
          setOverrides(null)
        }}
      />

      <main style={{ maxWidth: 1280, margin: '0 auto', padding: '28px 28px 80px' }}>
        {/* title + actions */}
        <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 24, flexWrap: 'wrap', marginBottom: 24 }}>
          <div style={{ flex: '1 1 320px' }}>
            <button className="btn btn-ghost btn-sm" onClick={onBack} style={{ marginLeft: -10, marginBottom: 4 }}>← all decisions</button>
            <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
              <div style={{ width: 52, height: 52, flexShrink: 0, borderRadius: 13, background: kindSoft(decision.type), border: `1px solid ${kindColor(decision.type)}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 28, boxShadow: 'var(--shadow-sm)' }}>{kindEmoji(decision.type)}</div>
              <h1 style={{ margin: 0, fontSize: 'clamp(24px, 3vw, 38px)', fontWeight: 500, letterSpacing: '-0.02em' }}>
                <InlineText value={decision.title} onCommit={onTitleUpdate} placeholder="What are you deciding?" />
              </h1>
            </div>
            <div style={{ marginTop: 8, display: 'flex', alignItems: 'center', gap: 8 }}>
              <Pill color={kindColor(decision.type)}>{decision.type || 'custom'}</Pill>
              <span className="label">started {new Date(decision.created_at).toLocaleDateString()}</span>
            </div>
          </div>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <button className="btn btn-outline btn-sm" onClick={() => onOpenMode('blind')}>Blind score mode</button>
            <button className="btn btn-outline btn-sm" onClick={() => onOpenMode('whatif')}>What-if</button>
            {decision.status === 'closed'
              ? <button className="btn btn-outline btn-sm" onClick={() => onStatusChange('active')}>Reopen</button>
              : <button className="btn btn-accent btn-sm" onClick={async () => { await onStatusChange('closed'); onBack() }}>✓ Close decision</button>}
            <button className="btn btn-ghost btn-sm" style={{ color: 'var(--neg)' }} onClick={() => { if (confirm('Archive this decision? It disappears from Home but stays in the database.')) onDelete() }}>Archive</button>
          </div>
        </div>

        {/* STANDINGS */}
        <section style={{ marginBottom: 32 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 14, gap: 12, flexWrap: 'wrap' }}>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, flexWrap: 'wrap' }}>
              <span className="label">standings · weighted total</span>
              {tied
                ? <Pill color="var(--neg)">tied · {top.name || 'option'} = {runner.name || 'option'}</Pill>
                : gap != null && gap < 0.6 && <Pill color="var(--neg)">tight · only {gap.toFixed(2)} ahead</Pill>}
              {robust != null && (
                <Pill color={robust >= 0.7 ? 'var(--accent)' : robust >= 0.4 ? 'var(--warn)' : 'var(--neg)'}>
                  robustness {robust.toFixed(2)}
                </Pill>
              )}
            </div>
            <span className="label">contribution stacks by parameter · {c.filled}/{c.total} considered</span>
          </div>

          {data.options.length === 0 && data.parameters.length === 0 ? (
            <EmptyState onAddParam={paramHandlers.onAdd} onAddOption={optionHandlers.onAdd} />
          ) : (
            <div className="card" style={{ overflow: 'hidden' }}>
              <StandingsList
                ranked={ranked} baseline={baseline}
                parameters={data.parameters} scores={data.scores}
                leaderId={top && !tied ? top.id : null}
                paramColors={paramColors} optColors={optColors} overrides={overrides}
                highlight={highlight} onHighlight={setHighlight} isWhatIf={isWhatIf}
                optionHandlers={optionHandlers}
              />
              <AddOptionRow onAdd={optionHandlers.onAdd} />
              <Legend parameters={data.parameters} paramColors={paramColors} highlight={highlight} onHighlight={setHighlight} overrides={overrides} />
            </div>
          )}
        </section>

        {/* MATRIX */}
        {(data.parameters.length > 0 || data.options.length > 0) && (
          <section>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 14 }}>
              <span className="label">matrix · click a cell to edit</span>
              <span className="label">{c.total - c.filled} empty</span>
            </div>
            <div className="card" style={{ overflow: 'auto' }}>
              <Matrix parameters={data.parameters} options={data.options} scores={data.scores}
                paramColors={paramColors} optColors={optColors} highlight={highlight} setHighlight={setHighlight}
                onScoreUpdate={onScoreUpdate} paramHandlers={paramHandlers} optionHandlers={optionHandlers}
                onWeightEdit={onWeightEdit}
              />
            </div>
          </section>
        )}
      </main>
    </div>
  )
}

// ── empty state ───
function EmptyState({ onAddParam, onAddOption }) {
  const [pDraft, setPDraft] = useState('')
  const [oDraft, setODraft] = useState('')
  return (
    <div style={{ border: '1px dashed var(--rule)', borderRadius: 8, padding: 32, background: 'var(--bg-soft)' }}>
      <p style={{ fontSize: 14, color: 'var(--ink-soft)', marginTop: 0, marginBottom: 16 }}>
        Empty matrix. Add <strong>parameters</strong> (what matters to you) and <strong>options</strong> (what you're comparing).
      </p>
      <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
        <input value={pDraft} onChange={e => setPDraft(e.target.value)} placeholder="+ first parameter…"
          onKeyDown={e => { if (e.key === 'Enter' && pDraft.trim()) { onAddParam(pDraft.trim()); setPDraft('') }}}
          style={{ padding: '8px 12px', border: '1px solid var(--rule)', borderRadius: 6, fontSize: 13, minWidth: 200, color: 'var(--ink)' }} />
        <input value={oDraft} onChange={e => setODraft(e.target.value)} placeholder="+ first option…"
          onKeyDown={e => { if (e.key === 'Enter' && oDraft.trim()) { onAddOption(oDraft.trim()); setODraft('') }}}
          style={{ padding: '8px 12px', border: '1px solid var(--rule)', borderRadius: 6, fontSize: 13, minWidth: 200, color: 'var(--ink)' }} />
      </div>
    </div>
  )
}

// ── animation helpers ──────────────────────────────────────────────────────
// (Score totals update instantly with a color transition; bar widths animate
//  via CSS. We deliberately avoid requestAnimationFrame count-ups, which
//  freeze in background tabs.)

// FLIP list — rows reorder instantly via React reconciliation; the bar-width
// transitions and a short rank-change pulse carry the motion.
function StandingsList({ ranked, baseline, optionHandlers, optColors, ...shared }) {
  return ranked.map((o, i) => (
    <LeaderRow key={o.id} option={o} rank={i} baselineRank={baseline.findIndex(x => x.id === o.id)}
      optColor={optColors[o.id]}
      onRename={v => optionHandlers.onUpdate(o.id, { name: v })}
      onDelete={() => optionHandlers.onDelete(o.id)}
      {...shared} />
  ))
}

function LeaderRow({ option, rank, parameters, scores, paramColors, optColor, leaderId, overrides, highlight, onHighlight, baselineRank, isWhatIf, onRename, onDelete }) {
  const [hover, setHover] = useState(false)
  const [pulse, setPulse] = useState(false)
  const prevRank = useRef(rank)
  useEffect(() => {
    if (prevRank.current !== rank) {
      setPulse(true)
      prevRank.current = rank
      const t = setTimeout(() => setPulse(false), 700)
      return () => clearTimeout(t)
    }
  }, [rank])
  const isTop = option.id === leaderId
  const shift = baselineRank - rank
  const parts = parameters.map(p => ({ p, contrib: paramContribution(option.id, p.id, scores, parameters, overrides) }))
  // the bar is drawn on the same 0–10 scale as the total; each segment is
  // that parameter's share of it, so the segments add up to the number shown
  const contribSum = parts.reduce((s, x) => s + x.contrib, 0)
  const total = option._total ?? 0
  const incomplete = option._scored < option._active
  return (
    <div onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{ display: 'grid', gridTemplateColumns: '40px 1fr 100px 36px', gap: 16, alignItems: 'center', padding: '18px 22px', borderBottom: '1px solid var(--rule-soft)',
        background: isTop ? (isWhatIf ? 'linear-gradient(90deg, var(--hi-soft), transparent 70%)' : 'linear-gradient(90deg, var(--accent-soft), transparent 70%)') : (hover ? 'var(--bg-soft)' : 'transparent'),
        boxShadow: isTop ? `inset 4px 0 0 ${isWhatIf ? 'var(--hi)' : 'var(--accent)'}` : (pulse ? `inset 3px 0 0 ${optColor}` : 'inset 0 0 0 transparent'),
        transition: 'background 150ms, box-shadow 500ms' }}>
      <span className="mono" style={{ fontSize: 22, fontWeight: 600, color: isTop ? (isWhatIf ? 'var(--hi)' : 'var(--accent)') : 'var(--ink-faint)' }}>{option._ranked ? String(rank + 1).padStart(2, '0') : '––'}</span>
      <div style={{ minWidth: 0 }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 8, flexWrap: 'wrap' }}>
          <span style={{ width: 9, height: 9, borderRadius: '50%', background: optColor, alignSelf: 'center', flexShrink: 0 }} />
          <span style={{ fontSize: 16, fontWeight: 500 }}>
            <InlineText value={option.name} onCommit={onRename} placeholder="option" style={{ fontSize: 16, fontWeight: 500 }} />
          </span>
          {isTop && <Pill color={isWhatIf ? 'var(--hi)' : 'var(--accent)'}>leading</Pill>}
          {option._ranked && shift > 0 && <Pill color="var(--accent)">↑{shift}</Pill>}
          {option._ranked && shift < 0 && <Pill color="var(--neg)">↓{Math.abs(shift)}</Pill>}
          {incomplete && <Pill color="var(--warn)">{option._scored}/{option._active} scored</Pill>}
        </div>
        <div style={{ height: isTop ? 14 : 10, borderRadius: 3, background: 'var(--bg-inset)', boxShadow: '0 0 0 1px var(--rule-soft)', overflow: 'hidden' }}>
          <div style={{ height: '100%', width: `${(total / 10) * 100}%`, display: 'flex', opacity: option._ranked ? 1 : 0.45, transition: 'width 320ms ease-out' }}>
            {parts.map(({ p, contrib }) => contrib > 0 && (
              <div key={p.id} title={`${p.name}: +${((contrib / contribSum) * total).toFixed(2)}`}
                onMouseEnter={() => onHighlight(p.id)} onMouseLeave={() => onHighlight(null)}
                style={{ width: `${(contrib / contribSum) * 100}%`, height: '100%', background: paramColors[p.id],
                  opacity: highlight == null || highlight === p.id ? 1 : 0.18,
                  transition: 'opacity 150ms, width 320ms ease-out' }} />
            ))}
          </div>
        </div>
      </div>
      <div style={{ textAlign: 'right' }}>
        <span className="mono" style={{ fontSize: 26, fontWeight: 500, color: isTop ? (isWhatIf ? 'var(--hi)' : 'var(--accent)') : option._ranked ? 'var(--ink)' : 'var(--ink-faint)', transition: 'color 200ms' }}>
          {option._total != null ? option._total.toFixed(2) : '—'}
        </span>
        <div style={{ marginTop: 2 }}><span className="label">{option._ranked || option._total == null ? 'of 10' : 'not ranked'}</span></div>
      </div>
      <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
        {hover && <button className="iconbtn" onClick={onDelete} title="remove option">×</button>}
      </div>
    </div>
  )
}

function Legend({ parameters, paramColors, highlight, onHighlight, overrides }) {
  return (
    <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap', padding: '12px 22px', borderTop: '1px solid var(--rule-soft)', background: 'var(--bg-soft)' }}>
      {parameters.map(pp => {
        const cur = overrides?.[pp.id] ?? Number(pp.weight)
        return (
          <button key={pp.id} onMouseEnter={() => onHighlight(pp.id)} onMouseLeave={() => onHighlight(null)}
            style={{ display: 'flex', alignItems: 'center', gap: 6, background: 'transparent', border: 'none', padding: 0,
              opacity: highlight == null || highlight === pp.id ? 1 : 0.35, transition: 'opacity 150ms' }}>
            <span style={{ width: 10, height: 10, borderRadius: 2, background: paramColors[pp.id] }} />
            <span style={{ fontSize: 11, color: 'var(--ink-soft)' }}>{pp.name}</span>
            <span className="mono" style={{ fontSize: 10, color: 'var(--ink-faint)' }}>w{cur.toFixed(0)}</span>
          </button>
        )
      })}
    </div>
  )
}

function AddOptionRow({ onAdd }) {
  const [draft, setDraft] = useState('')
  const commit = () => { if (draft.trim()) { onAdd(draft.trim()); setDraft('') } }
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '40px 1fr 100px 36px', gap: 16, alignItems: 'center', padding: '14px 22px', borderBottom: '1px solid var(--rule-soft)', background: 'var(--bg-soft)' }}>
      <span className="label">+</span>
      <input value={draft} onChange={e => setDraft(e.target.value)}
        onKeyDown={e => { if (e.key === 'Enter') commit() }} onBlur={commit}
        placeholder="add an option to compare…"
        style={{ border: 'none', padding: 0, fontSize: 14, color: 'var(--ink)', width: '100%' }} />
      <span className="label">enter</span><span />
    </div>
  )
}

// =============================================================================
// MATRIX
// =============================================================================
function Matrix({ parameters, options, scores, paramColors, optColors, highlight, setHighlight, onScoreUpdate, paramHandlers, optionHandlers, onWeightEdit }) {
  const [addParamDraft, setAddParamDraft] = useState('')
  return (
    <table style={{ borderCollapse: 'collapse', width: '100%', minWidth: 720 }}>
      <thead>
        <tr style={{ background: 'var(--bg-soft)', borderBottom: '1px solid var(--rule)' }}>
          <th style={{ padding: '12px 18px', textAlign: 'left', minWidth: 200, position: 'sticky', left: 0, background: 'var(--bg-soft)', zIndex: 2 }}><span className="label">consideration</span></th>
          <th style={{ padding: '12px 12px', textAlign: 'left', width: 60 }}><span className="label">w</span></th>
          {options.map((o, oi) => (
            <th key={o.id} style={{ padding: '12px 12px', textAlign: 'left', minWidth: 160, borderTop: `2px solid ${optColors[o.id]}` }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 7, fontSize: 13, fontWeight: 500 }}>
                <span style={{ width: 8, height: 8, borderRadius: '50%', background: optColors[o.id], flexShrink: 0 }} />
                <InlineText value={o.name} onCommit={v => optionHandlers.onUpdate(o.id, { name: v })} placeholder="option" style={{ fontSize: 13, fontWeight: 500 }} />
              </div>
            </th>
          ))}
        </tr>
      </thead>
      <tbody>
        {parameters.map(pp => {
          const isHi = highlight === pp.id
          return (
            <tr key={pp.id} onMouseEnter={() => setHighlight(pp.id)} onMouseLeave={() => setHighlight(null)}
              style={{ borderTop: '1px solid var(--rule-soft)', background: isHi ? 'var(--bg-soft)' : 'transparent', transition: 'background 150ms' }}>
              <td style={{ padding: '12px 18px', position: 'sticky', left: 0, background: isHi ? 'var(--bg-soft)' : 'var(--bg)', zIndex: 1 }}>
                <ParameterRow parameter={pp} color={paramColors[pp.id]} onUpdate={fields => paramHandlers.onUpdate(pp.id, fields)} onDelete={() => paramHandlers.onDelete(pp.id)} />
              </td>
              <td style={{ padding: '12px 12px' }}>
                <input type="number" min="0" max="10" step="0.5" value={pp.weight}
                  onChange={e => { const n = parseFloat(e.target.value); if (!isNaN(n)) onWeightEdit(pp.id, n) }}
                  style={{ width: 48, fontFamily: 'Geist Mono, monospace', fontSize: 13, border: '1px solid var(--rule)', borderRadius: 4, padding: '3px 6px', color: 'var(--ink)' }} />
              </td>
              {options.map(o => (
                <Cell key={o.id} param={pp} option={o}
                  score={scores.find(s => s.option_id === o.id && s.parameter_id === pp.id)}
                  onUpdate={fields => onScoreUpdate(o.id, pp.id, fields)} />
              ))}
            </tr>
          )
        })}
        <tr style={{ borderTop: '1px solid var(--rule-soft)' }}>
          <td colSpan={2 + options.length} style={{ padding: '12px 18px', background: 'var(--bg-soft)' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <span className="label">+</span>
              <input value={addParamDraft} onChange={e => setAddParamDraft(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter' && addParamDraft.trim()) { paramHandlers.onAdd(addParamDraft.trim()); setAddParamDraft('') }}}
                placeholder="add a consideration…"
                style={{ border: 'none', padding: 0, fontSize: 14, color: 'var(--ink)', flex: 1 }} />
              <span className="label">enter</span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  )
}

function ParameterRow({ parameter, color, onUpdate, onDelete }) {
  const [showType, setShowType] = useState(false)
  const options = Array.isArray(parameter.options) ? parameter.options : []
  return (
    <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
      <span style={{ width: 4, height: 20, background: color, borderRadius: 1, flexShrink: 0, marginTop: 2 }} />
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 13, fontWeight: 500 }}>
          <InlineText value={parameter.name} onCommit={v => onUpdate({ name: v })} placeholder="parameter" style={{ fontSize: 13, fontWeight: 500 }} />
        </div>
        <button onClick={() => setShowType(s => !s)} className="label" style={{ background: 'none', border: 'none', padding: '2px 0', display: 'inline-flex', alignItems: 'center', gap: 4 }}>
          <span style={{ opacity: 0.6 }}>{showType ? '▾' : '▸'}</span>
          {parameter.input_type || 'text'}{parameter.unit ? ` · ${parameter.unit}` : ''}{parameter.input_type === 'categorical' ? ` · ${options.length} opts` : ''}
        </button>
        {showType && (
          <div style={{ marginTop: 8, padding: 10, background: 'var(--bg-inset)', borderRadius: 4 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6 }}>
              <span className="label" style={{ fontSize: 9 }}>type</span>
              <select value={parameter.input_type || 'text'} onChange={e => {
                const t = e.target.value
                const u = { input_type: t }
                if (t !== 'number') u.unit = null

                if (t !== 'categorical') u.options = null

              }} style={{ fontSize: 11, border: '1px solid var(--rule)', borderRadius: 3, padding: '2px 4px', background: 'var(--bg)', color: 'var(--ink)' }}>
                <option value="text">text</option>

            {parameter.input_type === 'number' && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6 }}>
                <span className="label" style={{ fontSize: 9 }}>unit</span>
                <input value={parameter.unit || ''} onChange={e => onUpdate({ unit: e.target.value })}
                  placeholder="e.g. 万円, %, h"
                  style={{ fontSize: 11, border: '1px solid var(--rule)', borderRadius: 3, padding: '2px 4px', color: 'var(--ink)' }} />
              </div>
            )}
            {parameter.input_type === 'categorical' && (
              <div>
                <div className="label" style={{ fontSize: 9, marginBottom: 4 }}>options</div>
                {options.map((opt, i) => (
                  <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 4, marginBottom: 3 }}>
                    <input value={opt} onChange={e => { const n = [...options]; n[i] = e.target.value; onUpdate({ options: n }) }}
                      style={{ flex: 1, fontSize: 11, border: '1px solid var(--rule)', borderRadius: 3, padding: '2px 4px', color: 'var(--ink)' }} />
                    <button onClick={() => onUpdate({ options: options.filter((_, j) => j !== i) })} className="iconbtn" style={{ width: 20, height: 20, fontSize: 11 }}>×</button>
                  </div>
                ))}
                <button className="label" onClick={() => onUpdate({ options: [...options, ''] })} style={{ background: 'none', border: 'none', padding: 0 }}>+ add option</button>
              </div>
            )}
            <button className="iconbtn" onClick={onDelete} title="delete parameter" style={{ color: 'var(--neg)', marginTop: 6 }}>delete row</button>
          </div>
        )}
      </div>
    </div>
  )
}

// Score slider — drag 0–10 with visible value. Variant of WeightSlider sized
// to fit inside a matrix cell.
// While dragging, the value lives in local state; it's saved once on release,
// not on every pointer move (each change is a database write).
function ScoreSlider({ value, onChange }) {
  const trackRef = useRef(null)
  const [draft, setDraft] = useState(null)
  const draftRef = useRef(null)
  const dragging = draft != null
  const v = draft ?? value ?? null
  const move = cx => {
    if (!trackRef.current) return
    const r = trackRef.current.getBoundingClientRect()
    const t = Math.max(0, Math.min(1, (cx - r.left) / r.width))
    draftRef.current = Math.round(t * 20) / 2
    setDraft(draftRef.current)
  }
  useEffect(() => {
    if (!dragging) return
    const m = e => move(e.clientX)
    const u = () => {
      const next = draftRef.current
      draftRef.current = null
      setDraft(null)
      if (next != null && next !== value) onChange(next)
    }
    window.addEventListener('pointermove', m)
    window.addEventListener('pointerup', u)
    window.addEventListener('pointercancel', u)
    return () => { window.removeEventListener('pointermove', m); window.removeEventListener('pointerup', u); window.removeEventListener('pointercancel', u) }
  }, [dragging, value, onChange])
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      <div ref={trackRef}
        onPointerDown={e => move(e.clientX)}
        style={{ position: 'relative', flex: 1, height: 22, cursor: 'pointer', touchAction: 'none', userSelect: 'none' }}>
        {/* track */}
        <div style={{ position: 'absolute', top: 10, left: 0, right: 0, height: 2, background: 'var(--rule)', borderRadius: 1 }} />
        {/* fill (0 if unset) */}
        {v != null && (
          <div style={{ position: 'absolute', top: 10, left: 0, height: 2, width: `${(v / 10) * 100}%`, background: 'var(--accent)', borderRadius: 1, transition: dragging ? 'none' : 'width 180ms' }} />
        )}
        {/* tick marks at 0, 5, 10 */}
        {[0, 5, 10].map(t => (
          <div key={t} style={{ position: 'absolute', top: 7, left: `${(t / 10) * 100}%`, width: 1, height: 8, background: 'var(--ink-ghost)' }} />
        ))}
        {/* thumb */}
        {v != null ? (
          <div style={{ position: 'absolute', top: 4, left: `calc(${(v / 10) * 100}% - 7px)`, width: 14, height: 14, background: 'var(--accent)', border: '2px solid var(--bg)', borderRadius: '50%', boxShadow: dragging ? '0 0 0 4px color-mix(in oklch, var(--accent) 25%, transparent)' : '0 0 0 1px var(--accent)', transition: dragging ? 'none' : 'left 180ms' }} />
        ) : (
          // empty thumb hint at the start
          <div style={{ position: 'absolute', top: 4, left: -7, width: 14, height: 14, background: 'transparent', border: '2px dashed var(--ink-ghost)', borderRadius: '50%' }} />
        )}
      </div>
      <span className="mono" style={{ fontSize: 12, color: v != null ? 'var(--accent)' : 'var(--ink-faint)', minWidth: 26, textAlign: 'right', fontWeight: 500 }}>
        {v != null ? v.toFixed(1) : '—'}
      </span>
      {v != null && (
        <button onClick={() => onChange(null)} title="clear"
          style={{ background: 'transparent', border: 'none', color: 'var(--ink-ghost)', padding: 0, width: 14, height: 14, fontSize: 11, lineHeight: 1 }}>×</button>
      )}
    </div>
  )
}

// AI cross-check — asks Claude to challenge the user's rating given the
// parameter, option, raw evidence, and current score. Inline popover.
//
// The cross-check Edge Function builds the prompt itself from the ids, reading
// the rows with the signed-in user's token, so it only works on the user's own
// decisions and can't be used as a general Claude proxy.
async function askClaude(optionId, parameterId) {
  const { data, error } = await supabase.functions.invoke('cross-check', {
    body: { option_id: optionId, parameter_id: parameterId },
  })
  if (error) {
    let detail = error.message
    try { detail = (await error.context.json()).error || detail } catch {}
    throw new Error(`cross-check: ${detail}`)
  }
  return data?.text || ''
}

function CrossCheck({ param, option, score }) {
  const [open, setOpen] = useState(false)
  const [loading, setLoading] = useState(false)
  const [response, setResponse] = useState('')
  const [error, setError] = useState(null)
  const btnRef = useRef(null)
  const [pos, setPos] = useState({ top: 0, left: 0 })

  const ask = async () => {
    setLoading(true); setError(null); setResponse('')
    try {
      const text = await askClaude(option.id, param.id)
      setResponse(text)
    } catch (e) {
      setError(e?.message || String(e))
    } finally {
      setLoading(false)
    }
  }

  return (
    <div style={{ position: 'relative' }}>
      <button ref={btnRef} onClick={() => {
          const next = !open
          if (next && btnRef.current) {
            const r = btnRef.current.getBoundingClientRect()
            setPos({ top: Math.min(r.bottom + 6, window.innerHeight - 320), left: Math.max(8, Math.min(r.left, window.innerWidth - 336)) })
          }
          setOpen(next)
          if (next && !response && !loading) ask()
        }}
        disabled={score?.value == null}
        title={score?.value == null ? 'set a score first' : 'cross-check this rating'}
        style={{
          background: 'transparent', border: '1px solid var(--rule)', borderRadius: 4,
          padding: '2px 7px', fontSize: 10, color: 'var(--ink-soft)',
          display: 'inline-flex', alignItems: 'center', gap: 4, fontFamily: 'Geist Mono, monospace',
          letterSpacing: '0.04em', textTransform: 'uppercase',
          opacity: score?.value == null ? 0.3 : 1,
        }}>
        <span style={{ fontSize: 9 }}>◇</span> cross-check
      </button>
      {open && (
        <div style={{
          position: 'fixed', top: pos.top, left: pos.left, zIndex: 60,
          width: 320, padding: '14px 16px',
          background: 'var(--bg)', border: '1px solid var(--hi)', borderRadius: 6,
          boxShadow: '0 14px 30px rgba(0,0,0,0.18)',
        }}
        onClick={e => e.stopPropagation()}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
            <Pill color="var(--hi)">cross-check · {param.name}</Pill>
            <button onClick={() => setOpen(false)} className="iconbtn" style={{ width: 20, height: 20, fontSize: 12 }}>×</button>
          </div>
          {loading && <div style={{ fontSize: 12, color: 'var(--ink-soft)', fontStyle: 'italic' }}>thinking…</div>}
          {error && <div style={{ fontSize: 12, color: 'var(--neg)' }}>{error}</div>}
          {response && (
            <div style={{ fontSize: 12.5, lineHeight: 1.55, color: 'var(--ink)', whiteSpace: 'pre-wrap' }}>{response}</div>
          )}
          {response && (
            <button onClick={() => { setResponse(''); ask() }}
              style={{ marginTop: 10, background: 'transparent', border: '1px solid var(--rule)', borderRadius: 4, padding: '4px 8px', fontSize: 10, color: 'var(--ink-soft)', fontFamily: 'Geist Mono, monospace', letterSpacing: '0.04em', textTransform: 'uppercase' }}>
              ↻ ask again
            </button>
          )}
        </div>
      )}
    </div>
  )
}
// Raw value on top, draggable slider for the rating, AI cross-check below.
function Cell({ param, option, score, onUpdate }) {

function WhatIfOverlay({ data, onClose }) {
  const baseline = useMemo(() => rankedOptions(data.options, data.scores, data.parameters), [data])
  const { top: baseTop, runner: baseRunner, tied } = standing(baseline)
  const robust = useMemo(() => robustness(data.parameters, data.options, data.scores), [data])
  const baseSens = useMemo(() => perWeightSensitivity(data.parameters, data.options, data.scores), [data])

  useEffect(() => {
    const k = e => { if (e.key === 'Escape') onClose() }
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k)
  }, [onClose])

  return (
    <div className="overlay-bg" onClick={onClose}>
      <div className="overlay-card" onClick={e => e.stopPropagation()} style={{ width: 1080, maxWidth: '95vw' }}>
        <div style={{ padding: '24px 32px 18px', borderBottom: '1px solid var(--rule)', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', position: 'sticky', top: 0, background: 'var(--bg)', zIndex: 1 }}>
          <div>
            <span className="label">what-if · sensitivity</span>
            <h2 style={{ margin: '6px 0 0', fontSize: 26, fontWeight: 500, letterSpacing: '-0.02em' }}>Is the answer robust to how you weighted things?</h2>
          </div>
          <button className="iconbtn" onClick={onClose}>×</button>
        </div>
        <div style={{ padding: '24px 32px 40px' }}>
          {robust == null && (
            <div style={{ padding: '18px 22px', background: 'var(--bg-inset)', border: '1px solid var(--rule)', borderRadius: 8, fontSize: 14, lineHeight: 1.55, marginBottom: 28 }}>
              {tied
                ? <><strong>{baseTop.name || 'option'}</strong> and <strong>{baseRunner.name || 'option'}</strong> are tied, so there's no leader to stress-test. Score more considerations or adjust weights to separate them.</>
                : 'Not enough scores yet to test. Each option needs scores on at least half of the weighted considerations.'}
            </div>
          )}
          {robust != null && baseTop && (
            <div style={{ padding: '24px 28px', background: 'var(--ink)', color: 'var(--bg)', borderRadius: 8, display: 'grid', gridTemplateColumns: 'auto 1fr', gap: 32, alignItems: 'center', marginBottom: 28 }}>
              <div>
                <span className="label" style={{ color: 'oklch(0.7 0.05 240)' }}>robustness</span>
                <div style={{ fontSize: 56, fontWeight: 500, lineHeight: 1, marginTop: 6 }}>{robust.toFixed(2)}</div>
              </div>
              <div style={{ fontSize: 14, lineHeight: 1.55 }}>
                Across 100 weight perturbations (±2 on each weight), <strong>{baseTop.name}</strong> stays on top{' '}
                <strong style={{ color: 'var(--accent)' }}>{Math.round(robust * 100)}%</strong> of the time.{' '}
                {robust >= 0.7 ? 'The pick is robust.' : robust >= 0.4 ? 'Mixed — sleep on it.' : 'Fragile — different weights would pick differently.'}
              </div>
            </div>
          )}
          {baseSens.length > 0 && <section>
            <span className="label">per-weight sensitivity · how often does sweeping each weight 0→10 flip the leader?</span>
            <div style={{ marginTop: 14, display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(230px, 1fr))', gap: 12 }}>
              {baseSens.map((row, i) => {
                const flag = row.sens > 0.4
                return (
                  <div key={i} style={{ padding: '14px 16px', border: `1px solid ${flag ? 'var(--neg)' : 'var(--rule)'}`, background: flag ? 'var(--neg-soft)' : 'var(--bg)', borderRadius: 6 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8 }}>
                      <span style={{ fontSize: 13, fontWeight: 500 }}>{row.p.name}</span>
                      <span className="mono" style={{ fontSize: 13, color: flag ? 'var(--neg)' : 'var(--ink)' }}>{row.sens.toFixed(2)}</span>
                    </div>
                    <div style={{ height: 4, background: 'var(--rule-soft)', borderRadius: 2 }}>
                      <div style={{ width: `${row.sens * 100}%`, height: '100%', background: flag ? 'var(--neg)' : 'var(--ink)', borderRadius: 2, transition: 'width 300ms' }} />
                    </div>
                    <span className="label" style={{ marginTop: 6, display: 'block', color: flag ? 'var(--neg)' : undefined }}>
                      {flag ? `⚠ flips around w=${row.flipAt?.toFixed(1) ?? '?'}` : row.sens > 0.15 ? 'medium impact' : 'low impact'}
                    </span>
                  </div>
                )
              })}
            </div>
          </section>}
        </div>
      </div>
    </div>
  )
}

// BLIND SCORE OVERLAY
// =============================================================================
function BlindOverlay({ data, onScoreUpdate, onClose }) {
  const [paramIdx, setParamIdx] = useState(0)
  const [revealed, setRevealed] = useState(false)
  // scores given in this pass, for the current parameter only. Earlier scores
  // stay hidden until reveal so they can't anchor the new ones.
  const [pass, setPass] = useState({})
  // new random order each time the overlay opens, stable while it's open
  const [seed] = useState(() => Math.floor(Math.random() * 2 ** 32))
  const params = data.parameters
  const param = params[paramIdx]
  const order = useMemo(
    () => param ? shuffled(data.options, mulberry32(seed ^ hashString(param.id))) : [],
    [data.options, param?.id, seed])
  const goTo = i => { setParamIdx(i); setRevealed(false); setPass({}) }

  useEffect(() => {
    const k = e => { if (e.key === 'Escape') onClose() }
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k)
  }, [onClose])

  if (!param) {
    return (
      <div className="overlay-bg" onClick={onClose}>
        <div className="overlay-card" onClick={e => e.stopPropagation()} style={{ width: 520, padding: 40, textAlign: 'center' }}>
          <span className="label">no parameters yet</span>
          <p style={{ marginTop: 12, fontSize: 14, color: 'var(--ink-soft)' }}>Add some considerations first.</p>
          <button className="btn btn-primary" onClick={onClose} style={{ marginTop: 18 }}>OK</button>
        </div>
      </div>
    )
  }
  const scoredCount = order.filter(o => pass[o.id] != null).length

  return (
    <div className="overlay-bg" onClick={onClose}>
      <div className="overlay-card" onClick={e => e.stopPropagation()} style={{ width: 840, maxWidth: '95vw' }}>
        <div style={{ padding: '20px 32px 16px', borderBottom: '1px solid var(--rule)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', position: 'sticky', top: 0, background: 'var(--bg)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <Pill color="var(--hi)">blind mode</Pill>
            <span className="label">{paramIdx + 1} of {params.length}</span>
            <div style={{ display: 'flex', gap: 3 }}>
              {params.map((_, i) => <div key={i} style={{ width: 20, height: 3, background: i <= paramIdx ? 'var(--accent)' : 'var(--rule)', borderRadius: 1 }} />)}
            </div>
          </div>
          <button className="iconbtn" onClick={onClose}>×</button>
        </div>
        <div style={{ padding: '28px 32px 40px' }}>
          <span className="label" style={{ color: 'var(--hi)' }}>anti-bias · halo-effect killer</span>
          <h2 style={{ margin: '8px 0 6px', fontSize: 26, fontWeight: 500, letterSpacing: '-0.01em' }}>Score {param.name} across all options. Names hidden.</h2>
          <p style={{ margin: '0 0 24px', fontSize: 13, lineHeight: 1.6, color: 'var(--ink-soft)', maxWidth: 580 }}>
            Score this one thing for every option at once. Names are hidden — only raw evidence is shown. Reveal at the end: do your scores match your gut?
          </p>
          <div style={{ padding: '14px 18px', background: 'var(--bg-inset)', border: '1px solid var(--rule)', borderRadius: 6, display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }}>
            <div>
              <span className="label">now scoring</span>
              <div style={{ marginTop: 2, fontSize: 22, fontWeight: 500 }}>{param.name}</div>
              <div style={{ fontSize: 11, color: 'var(--ink-soft)', marginTop: 2 }}>weight {param.weight} · {param.input_type || 'text'}{param.unit ? ` · ${param.unit}` : ''}</div>
            </div>
            <span className="label">{scoredCount}/{order.length} scored this pass</span>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {order.map((o, i) => {
              const score = data.scores.find(s => s.option_id === o.id && s.parameter_id === param.id)
              return <BlindCard key={o.id} letter={String.fromCharCode(65 + i)} option={o} score={score} param={param} revealed={revealed}
                passValue={pass[o.id]}
                onScore={v => { setPass(p => ({ ...p, [o.id]: v })); onScoreUpdate(o.id, param.id, { value: v }) }}
                onRaw={v => onScoreUpdate(o.id, param.id, { notes: v })} />
            })}
          </div>
          <div style={{ marginTop: 24, padding: '14px 18px', background: 'var(--bg-soft)', borderRadius: 6, display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
            <div style={{ fontSize: 12, color: 'var(--ink-soft)' }}>
              <strong style={{ color: 'var(--ink)' }}>Tip:</strong> if scored gut feel doesn't match your originally-named pick, that's the bias.
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <button className="btn btn-outline btn-sm" onClick={() => setRevealed(r => !r)}>{revealed ? 'Hide names' : 'Reveal names'}</button>
              <button className="btn btn-outline btn-sm" disabled={paramIdx === 0} onClick={() => goTo(paramIdx - 1)}>← prev</button>
              {paramIdx < params.length - 1
                ? <button className="btn btn-primary btn-sm" onClick={() => goTo(paramIdx + 1)}>Next →</button>
                : <button className="btn btn-primary btn-sm" onClick={onClose}>Done</button>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  )
}

function BlindCard({ letter, option, score, param, revealed, passValue, onScore, onRaw }) {
  const [editingRaw, setEditingRaw] = useState(false)
  const hasRaw = score?.notes != null && score.notes !== ''
  const done = passValue != null
  const hadEarlier = score?.value != null && !done
  return (
    <div style={{ padding: '16px 20px', border: `1px solid ${done ? 'var(--rule)' : 'var(--hi)'}`, background: done ? 'var(--bg)' : 'var(--hi-soft)', borderRadius: 6, display: 'grid', gridTemplateColumns: '52px 1fr auto', gap: 18, alignItems: 'center' }}>
      <div style={{ width: 44, height: 44, background: revealed ? 'var(--accent)' : (done ? 'var(--bg-inset)' : 'var(--hi)'), borderRadius: 6, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18, fontWeight: 600, color: revealed ? 'var(--bg)' : (done ? 'var(--ink)' : 'var(--bg)'), transition: 'all 220ms' }}>
        {revealed ? option.name?.charAt(0).toUpperCase() : letter}
      </div>
      <div style={{ minWidth: 0 }}>
        <span className="label">{revealed ? option.name : 'option ' + letter}</span>
        <div style={{ marginTop: 4 }}>
          {editingRaw
            ? <RawInput value={score?.notes} unit={param.unit} type={param.input_type} options={param.options} onChange={v => { onRaw(v); setEditingRaw(false) }} />
            : <div onClick={() => setEditingRaw(true)} style={{ fontSize: 16, fontStyle: hasRaw ? 'italic' : 'normal', cursor: 'text', minHeight: 22 }}>
                {hasRaw ? `"${score.notes}${param.unit ? ' ' + param.unit : ''}"` : <span style={{ color: 'var(--ink-faint)' }}>+ add evidence</span>}
              </div>
          }
        </div>
        {hadEarlier && (
          <span className="label" style={{ marginTop: 6, display: 'block' }}>
            {revealed ? `earlier score ${Number(score.value).toFixed(1)}` : 'earlier score hidden · picking replaces it'}
          </span>
        )}
      </div>
      <div style={{ display: 'flex', gap: 4 }}>
        {[0, 2.5, 5, 7.5, 10].map(v => {
          const on = passValue === v
          return (
            <button key={v} onClick={() => onScore(v)} className="mono" aria-pressed={on}
              style={{ padding: '6px 11px', background: on ? 'var(--accent)' : 'var(--bg)', border: `1px solid ${on ? 'var(--accent)' : 'var(--rule)'}`, fontSize: 11, borderRadius: 4, color: on ? '#fff' : 'var(--ink)', fontWeight: on ? 600 : 400 }}
              onMouseEnter={e => { if (!on) { e.currentTarget.style.background = 'var(--ink)'; e.currentTarget.style.color = 'var(--bg)' } }}
              onMouseLeave={e => { if (!on) { e.currentTarget.style.background = 'var(--bg)'; e.currentTarget.style.color = 'var(--ink)' } }}
            >{v}</button>
          )
        })}
      </div>
    </div>
  )
}
