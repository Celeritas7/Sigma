<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Σ — Sigma</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

<!-- Light or dark before first paint, so a dark-mode user never sees a white
     flash. Same rule as resolveTheme in src/lib/theme.js. -->
<script>
  try {
    var p = localStorage.getItem('sigma_theme');
    var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (_) { document.documentElement.dataset.theme = 'light'; }
</script>
<!-- GitHub Pages caches this page for 10 minutes, but each deploy renames the
     built script and stylesheet. A browser holding the old page then asks for
     files that no longer exist and shows nothing. If that happens, reload once
     (a reload re-fetches the page itself from the server). The sessionStorage
     flag stops a loop if the file really is missing. -->
<script>
  window.addEventListener('error', function (e) {
    var t = e.target;
    var url = t && (t.tagName === 'SCRIPT' ? t.src : t.tagName === 'LINK' ? t.href : '');
    if (!url || !/\/assets\//.test(url)) return;
    try {
      if (sessionStorage.getItem('sigma-reloaded-for') === url) return;
      sessionStorage.setItem('sigma-reloaded-for', url);
    } catch (_) { return; }
    location.reload();
  }, true);
</script>
<!-- module scripts run after the page is parsed, so the broadcast script below is loaded first -->
<script type="module" src="/src/main.jsx"></script>
</head>
<body>
<div id="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>
<div id="root"></div>

<script src="https://celeritas7.github.io/Akatsuki/js/akatsuki-broadcast.js"></script>
</body>
</html>
